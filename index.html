<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b91c1c">
  <title>Elite Stays | Holiday Homes</title>
  <style>
    :root{--bg:#f6f7f9;--surface:#fff;--text:#18212f;--muted:#687386;--line:#e3e7ee;--accent:#b91c1c;--accent-2:#8f1515;--soft:#fff1f1;--green:#16834b;--amber:#b45309;--blue:#2563eb;--danger:#dc2626;--shadow:0 12px 32px #17203312}
    [data-theme=dark]{--bg:#10141c;--surface:#171d27;--text:#f3f5f8;--muted:#a6b0bf;--line:#2b3442;--soft:#351d22;--accent:#ed5b5b;--accent-2:#c84444;--shadow:0 12px 32px #0005}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .shell{display:flex;min-height:100vh}.sidebar{width:244px;background:var(--surface);border-right:1px solid var(--line);padding:28px 16px;position:fixed;inset:0 auto 0 0;z-index:3}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 30px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:18px}.brand strong{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.sidebar-footer{position:absolute;bottom:24px;left:28px;right:28px;color:var(--muted);font-size:12px}
    main{margin-left:244px;width:calc(100% - 244px)}.topbar{height:74px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;position:sticky;top:0;z-index:2}.topbar h1{font-size:20px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;align-items:center}.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:700}.content{max-width:1440px;margin:auto;padding:32px 38px 56px}.hero{background:linear-gradient(120deg,var(--accent),#d74646);color:#fff;border-radius:18px;padding:26px 28px;display:flex;justify-content:space-between;gap:18px;box-shadow:var(--shadow);margin-bottom:24px}.hero h2{margin:4px 0;font-size:28px}.hero p{margin:0;opacity:.78}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;opacity:.72}.period{background:#7d1010aa;border-radius:999px;padding:8px 15px;height:max-content;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
    .grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}.stat{min-height:124px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:800;margin:12px 0 3px}.stat .detail{font-size:12px;color:var(--muted)}.stat.red{background:var(--accent);color:#fff;border-color:transparent}.stat.green{background:#16834b;color:#fff;border-color:transparent}.stat.amber{background:#b45309;color:#fff;border-color:transparent}.stat.blue{background:#2563eb;color:#fff;border-color:transparent}.stat.red .label,.stat.red .detail,.stat.green .label,.stat.green .detail,.stat.amber .label,.stat.amber .detail,.stat.blue .label,.stat.blue .detail{color:#fff;opacity:.8}
    .card h3{font-size:15px;margin:0 0 16px}.card-head,.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}.page-head h2{margin:0;font-size:24px}.muted{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:10px}.field{display:grid;gap:6px;flex:1;min-width:150px}.field label{font-size:11px;font-weight:700;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--bg);color:var(--text);outline:0}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #b91c1c18}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:700;background:var(--accent);color:#fff}.btn:hover{background:var(--accent-2)}.btn.secondary{background:var(--bg);border:1px solid var(--line);color:var(--text)}.btn.small{padding:7px 10px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid var(--line)}.table tr:last-child td{border:0}.pill{border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;display:inline-block}.pill.green{color:var(--green);background:#16834b18}.pill.amber{color:var(--amber);background:#b4530918}.pill.red{color:var(--danger);background:#dc262618}.pill.blue{color:var(--blue);background:#2563eb18}
    .summary{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.summary:last-child{border:0}.chart{height:190px;display:flex;align-items:end;gap:12px;padding:20px 8px 0}.bar{flex:1;min-width:24px;background:linear-gradient(var(--accent),#ec8181);border-radius:7px 7px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}.notice{background:#b4530912;border:1px solid #b4530944;border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;margin-bottom:16px}.notice strong{display:block}.empty{text-align:center;color:var(--muted);padding:30px}.mobile-nav{display:none}
    dialog{border:0;border-radius:16px;background:var(--surface);color:var(--text);padding:0;width:min(560px,calc(100% - 28px));box-shadow:0 24px 80px #0005}dialog::backdrop{background:#0b102080}.modal{padding:24px}.modal h3{margin:0 0 20px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-grid .wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{display:none}main{margin:0;width:100%;padding-bottom:78px}.topbar{padding:0 18px;height:66px}.topbar h1{font-size:17px}.content{padding:20px 16px}.hero{padding:22px;display:block}.period{display:inline-block;margin-top:18px}.two,.stats{grid-template-columns:1fr}.card{padding:16px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:4;justify-content:space-around;padding:8px}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.mobile-nav button.active{color:var(--accent);font-weight:700}.modal-grid{grid-template-columns:1fr}.modal-grid .wide{grid-column:auto}.page-head{align-items:start;flex-direction:column;margin-bottom:18px}.toolbar .field{min-width:100%}}
  </style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">E</div><div><strong>Elite Stays</strong><small>Holiday Homes</small></div></div><nav class="nav" id="nav"></nav><div class="sidebar-footer">Operations workspace<br><span id="storage-note">Saved locally</span></div></aside><main><header class="topbar"><div><h1 id="top-title">Owner Dashboard</h1><p id="today"></p></div><div class="actions"><button class="icon-btn" id="theme-btn" title="Toggle theme">◐</button><span class="avatar">EA</span></div></header><div class="content" id="app"></div></main><nav class="mobile-nav" id="mobile-nav"></nav></div>
<dialog id="booking-dialog"><form class="modal" id="booking-form"><h3 id="booking-title">Add booking</h3><div class="modal-grid"><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Room</label><input name="room" type="number" min="1" required></div><div class="field wide"><label>Guest name</label><input name="guest" required placeholder="Guest name"></div><div class="field"><label>Duration (hours)</label><input name="hours" type="number" min="1" required></div><div class="field"><label>Amount (AED)</label><input name="amount" type="number" min="1" step=".01" required></div><div class="field wide"><label>Collected by</label><select name="collector"><option>Ahmed</option><option>Fatima</option><option>Omar</option></select></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn">Save booking</button></div></form></dialog>
<dialog id="expense-dialog"><form class="modal" id="expense-form"><h3>Add expense</h3><div class="modal-grid"><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Type</label><select name="type"><option>Business</option><option>Personal</option></select></div><div class="field wide"><label>Description</label><input name="description" required placeholder="e.g. Cleaning supplies"></div><div class="field"><label>Amount (AED)</label><input name="amount" type="number" min="1" step=".01" required></div><div class="field"><label>Entered by</label><select name="entered"><option>Ahmed</option><option>Fatima</option><option>Omar</option></select></div></div><div class="modal-actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn">Save expense</button></div></form></dialog>
<script>
const icons={dashboard:"▦",bookings:"▣",expenses:"◈",team:"♙"};
const seed={bookings:[{id:1,date:new Date().toISOString().slice(0,10),room:101,guest:"Maya Wilson",hours:3,amount:320,collector:"Ahmed",status:"active",checkIn:Date.now()-3600000},{id:2,date:new Date().toISOString().slice(0,10),room:204,guest:"Ravi Kumar",hours:2,amount:240,collector:"Fatima",status:"checked_out",checkIn:Date.now()-10800000}],expenses:[{id:1,date:new Date().toISOString().slice(0,10),description:"Linen and towels",type:"Business",amount:180,entered:"Ahmed"},{id:2,date:new Date().toISOString().slice(0,10),description:"Taxi reimbursement",type:"Personal",amount:65,entered:"Fatima"}],team:[{name:"Ahmed Hassan",email:"ahmed@elites stays.ae".replace(" ",""),role:"Staff"},{name:"Fatima Ali",email:"fatima@elitestays.ae",role:"Staff"},{name:"Elite Stays Admin",email:"admin@elitestays.ae",role:"Admin"}]};
let data=JSON.parse(localStorage.getItem("elite-stays-data")||"null")||seed;let page=location.hash.slice(1)||"dashboard";let dark=localStorage.getItem("elite-stays-theme")==="dark";document.documentElement.dataset.theme=dark?"dark":"light";
const money=n=>`AED ${Number(n||0).toLocaleString("en-AE",{maximumFractionDigits:0})}`, today=new Date().toLocaleDateString("en-AE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}), save=()=>localStorage.setItem("elite-stays-data",JSON.stringify(data));
function nav(){const items=[["dashboard","Dashboard"],["bookings","Bookings"],["expenses","Expenses"],["team","Team"]];document.querySelector("#nav").innerHTML=items.map(([id,label])=>`<button class="${page===id?"active":""}" data-page="${id}"><span>${icons[id]}</span>${label}</button>`).join("");document.querySelector("#mobile-nav").innerHTML=items.map(([id,label])=>`<button class="${page===id?"active":""}" data-page="${id}"><div>${icons[id]}</div>${label}</button>`).join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;location.hash=page;render()})}
function layout(title,body){document.querySelector("#top-title").textContent=title;document.querySelector("#today").textContent=today;return body}
function stats(){let todayBookings=data.bookings.filter(b=>b.date===new Date().toISOString().slice(0,10)),sales=todayBookings.reduce((a,b)=>a+Number(b.amount),0),biz=data.expenses.filter(e=>e.date===todayBookings[0]?.date&&e.type==="Business").reduce((a,e)=>a+Number(e.amount),0),personal=data.expenses.filter(e=>e.date===todayBookings[0]?.date&&e.type==="Personal").reduce((a,e)=>a+Number(e.amount),0);return `<div class="grid stats"><div class="stat blue"><div class="label">Today's Sales</div><div class="value">${money(sales)}</div><div class="detail">${todayBookings.length} booking${todayBookings.length===1?"":"s"} today</div></div><div class="stat amber"><div class="label">Business Expenses</div><div class="value">${money(biz)}</div><div class="detail">Operating costs entered today</div></div><div class="stat"><div class="label">Personal Expenses</div><div class="value">${money(personal)}</div><div class="detail">Personal costs entered today</div></div><div class="stat ${sales-biz>=0?"green":"red"}"><div class="label">Today's Net</div><div class="value">${money(sales-biz)}</div><div class="detail">Sales minus business expenses</div></div></div>`}
function dashboard(){let sales=data.bookings.reduce((a,b)=>a+Number(b.amount),0),business=data.expenses.filter(e=>e.type==="Business").reduce((a,e)=>a+Number(e.amount),0),active=data.bookings.filter(b=>["active","extended"].includes(b.status)).length;let byPerson={};data.bookings.forEach(b=>byPerson[b.collector]=(byPerson[b.collector]||0)+Number(b.amount));let bars=Object.entries(byPerson).map(([n,v])=>`<div class="bar" style="height:${Math.max(15,Math.min(100,v/(sales||1)*100))}%"><span>${n}</span></div>`).join("");return layout("Owner Dashboard",`<section class="hero"><div><div class="eyebrow">Elite Stays · Holiday Homes</div><h2>Owner Dashboard</h2><p>Keep every room, booking, and expense under control.</p></div><div class="period">Live operations</div></section>${stats()}<div class="grid two" style="margin-top:16px"><section class="card"><h3>Today's room activity</h3><div class="summary"><span>Active rooms</span><strong>${active}</strong></div><div class="summary"><span>Total bookings</span><strong>${data.bookings.length}</strong></div><div class="summary"><span>Collected revenue</span><strong class="muted">${money(sales)}</strong></div><div class="summary"><span>Business expenses</span><strong style="color:var(--amber)">${money(business)}</strong></div></section><section class="card"><h3>Collections by staff member</h3>${bars?`<div class="chart">${bars}</div>`:`<div class="empty">Collections appear after bookings are recorded.</div>`}</section></div><section class="card" style="margin-top:16px"><div class="card-head"><h3>Recent room bookings</h3><button class="btn small" data-action="add-booking">+ Add booking</button></div>${bookingTable(data.bookings.slice(-5).reverse())}</section>`)}
function status(b){let label=b.status.replace("_"," ");let c=b.status==="active"||b.status==="extended"?"green":b.status==="checked_out"?"amber":b.status==="overstay"?"red":"blue";return `<span class="pill ${c}">${label}</span>`}
function bookingTable(rows){if(!rows.length)return`<div class="empty">No bookings yet.</div>`;return`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Room</th><th>Guest</th><th>Hours</th><th>Amount</th><th>Staff</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td>${b.date}</td><td><strong>${b.room}</strong></td><td>${b.guest}</td><td>${b.hours}h</td><td>${money(b.amount)}</td><td>${b.collector}</td><td>${status(b)}</td><td>${b.status==="active"?`<button class="btn small secondary" data-checkout="${b.id}">Check out</button>`:b.status==="checked_out"?`<button class="btn small secondary" data-clean="${b.id}">Mark clean</button>`:""}</td></tr>`).join("")}</tbody></table></div>`}
function bookings(){return layout("Bookings",`<div class="page-head"><div><h2>Bookings</h2><p class="muted">Room stays, check-in timers, and cleaning handoff.</p></div><button class="btn" data-action="add-booking">+ Add booking</button></div>${data.bookings.some(b=>b.status==="checked_out")?`<div class="notice">⚠️ <div><strong>Rooms needing attention</strong><span class="muted"> Upload a cleaning confirmation after checkout.</span></div></div>`:""}<section class="card"><div class="toolbar"><div class="field"><label>Search bookings</label><input id="booking-search" placeholder="Guest, room, or staff"></div><div class="field"><label>Status</label><select id="booking-filter"><option value="">All statuses</option><option>active</option><option>checked_out</option><option>cleaned</option></select></div></div><div id="booking-results" style="margin-top:18px">${bookingTable(data.bookings)}</div></section>`)}
function expenses(){return layout("Expenses",`<div class="page-head"><div><h2>Expenses</h2><p class="muted">Track business and personal costs with a clear audit trail.</p></div><button class="btn" data-action="add-expense">+ Add expense</button></div><section class="card"><div class="toolbar"><div class="field"><label>Search expenses</label><input id="expense-search" placeholder="Description or staff"></div><div class="field"><label>Expense type</label><select id="expense-filter"><option value="">All types</option><option>Business</option><option>Personal</option></select></div></div><div id="expense-results" style="margin-top:18px">${expenseTable(data.expenses)}</div></section>`)}
function expenseTable(rows){if(!rows.length)return`<div class="empty">No expenses match these filters.</div>`;return`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th>Entered by</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${e.date}</td><td><strong>${e.description}</strong></td><td><span class="pill ${e.type==="Business"?"blue":"amber"}">${e.type}</span></td><td>${money(e.amount)}</td><td>${e.entered}</td></tr>`).join("")}</tbody></table></div>`}
function team(){return layout("Team",`<div class="page-head"><div><h2>Team</h2><p class="muted">People who keep Elite Stays moving.</p></div></div><div class="grid stats"><div class="stat"><div class="label">Staff members</div><div class="value">${data.team.filter(x=>x.role==="Staff").length}</div></div><div class="stat"><div class="label">Admins</div><div class="value">${data.team.filter(x=>x.role==="Admin").length}</div></div></div><section class="card" style="margin-top:16px"><h3>People</h3><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${data.team.map(u=>`<tr><td><strong>${u.name}</strong></td><td class="muted">${u.email}</td><td><span class="pill ${u.role==="Admin"?"red":"green"}">${u.role}</span></td></tr>`).join("")}</tbody></table></div></section>`)}
function render(){nav();document.querySelector("#app").innerHTML={dashboard,bookings,expenses,team}[page]?.()||dashboard();bind();if(page==="bookings")filterBookings();if(page==="expenses")filterExpenses()}
function bind(){document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>openModal(b.dataset.action));document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest("dialog").close());document.querySelectorAll("[data-checkout]").forEach(b=>b.onclick=()=>{let x=data.bookings.find(v=>v.id==b.dataset.checkout);x.status="checked_out";save();render()});document.querySelectorAll("[data-clean]").forEach(b=>b.onclick=()=>{let x=data.bookings.find(v=>v.id==b.dataset.clean);x.status="cleaned";save();render()});document.querySelector("#booking-search")?.addEventListener("input",filterBookings);document.querySelector("#booking-filter")?.addEventListener("change",filterBookings);document.querySelector("#expense-search")?.addEventListener("input",filterExpenses);document.querySelector("#expense-filter")?.addEventListener("change",filterExpenses)}
function filterBookings(){let q=(document.querySelector("#booking-search")?.value||"").toLowerCase(),f=document.querySelector("#booking-filter")?.value||"";let rows=data.bookings.filter(b=>(!q||[b.guest,b.room,b.collector].some(v=>String(v).toLowerCase().includes(q)))&&(!f||b.status===f));let x=document.querySelector("#booking-results");if(x)x.innerHTML=bookingTable(rows);bind()}
function filterExpenses(){let q=(document.querySelector("#expense-search")?.value||"").toLowerCase(),f=document.querySelector("#expense-filter")?.value||"";let rows=data.expenses.filter(e=>(!q||[e.description,e.entered,e.type].some(v=>String(v).toLowerCase().includes(q)))&&(!f||e.type===f));let x=document.querySelector("#expense-results");if(x)x.innerHTML=expenseTable(rows)}
function openModal(which){let d=document.querySelector(which==="add-booking"?"#booking-dialog":"#expense-dialog");d.querySelectorAll("input").forEach(i=>{if(i.type==="date")i.value=new Date().toISOString().slice(0,10);else i.value=""});d.showModal()}
document.querySelector("#booking-form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.bookings.push({id:Date.now(),date:f.get("date"),room:f.get("room"),guest:f.get("guest"),hours:Number(f.get("hours")),amount:Number(f.get("amount")),collector:f.get("collector"),status:"active",checkIn:Date.now()});save();e.target.closest("dialog").close();page="bookings";location.hash=page;render()};
document.querySelector("#expense-form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.expenses.push({id:Date.now(),date:f.get("date"),description:f.get("description"),type:f.get("type"),amount:Number(f.get("amount")),entered:f.get("entered")});save();e.target.closest("dialog").close();page="expenses";location.hash=page;render()};
document.querySelector("#theme-btn").onclick=()=>{dark=!dark;document.documentElement.dataset.theme=dark?"dark":"light";localStorage.setItem("elite-stays-theme",dark?"dark":"light")};window.onhashchange=()=>{page=location.hash.slice(1)||"dashboard";render()};render();
</script>
</body>
</html>
